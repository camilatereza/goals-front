<ng-container>
  @if (listSmart$ | async ; as smarts) {
  <mat-card>
    <mat-toolbar color="accent">
      <mat-toolbar-row>
        <h1>{{ "grupo de metas" | titlecase }}</h1>
        <span class="spacer"></span>
        <a routerLink="/grupos">Ver mais</a>
      </mat-toolbar-row>
    </mat-toolbar>
    <mat-card-content class="groups_content" style="text-align: center;"> Carrossel com grupos favoritos em breve </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-toolbar color="accent">
      <mat-toolbar-row>
        <h1>{{ "metas favoridas" | titlecase }}</h1>
        <span class="spacer"></span>
        <a routerLink="/metas">Ver mais</a>
      </mat-toolbar-row>
    </mat-toolbar>
    <mat-card-content style="text-align: center;"> Carrossel com metas favoritas em breve </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-toolbar color="accent">
      <mat-toolbar-row>
        <h1>{{ "metódos de organização" | titlecase }}</h1>
        <span class="spacer"></span>
        <a routerLink="/metodos">Ver mais</a>
      </mat-toolbar-row>
    </mat-toolbar>
    <mat-card-content class="methods">
      <app-common-methods [type]="'smart'" [smartsData]="smarts"/>
      <app-common-methods [type]="'areas'"/>
    </mat-card-content>
  </mat-card>

  } @else {
  <app-common-error></app-common-error>
  }
</ng-container>
