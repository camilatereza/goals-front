@if (type == 'favorite') {
<button
  mat-icon-button
  matTooltip="Favoritar dado"
  color="primary"
  (click)="toggleFavorite()"
>
  <mat-icon>{{ item.favorite ? "favorite" : "favorite_border" }}</mat-icon>
</button>
} @else if (type == 'delete') {
<button
  mat-icon-button
  matTooltip="Remover dado"
  color="warn"
  (click)="openDeleteDialog()"
>
  <mat-icon>delete</mat-icon>
</button>
} @else if (type == 'back'){
<button mat-fab class="btn" matTooltip="Voltar" color="warn" (click)="back()">
  <mat-icon>arrow_back</mat-icon>
</button>
}
