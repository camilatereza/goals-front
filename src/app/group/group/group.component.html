<ng-container>
  <mat-toolbar color="accent" class="header">
    <h1 class="title">{{ "grupos de metas" | titlecase }}</h1>
    <span class="spacer"></span>
    <button (click)="onAdd()" mat-fab color="primary" class="btn">
      <mat-icon>add_card</mat-icon>
    </button>
  </mat-toolbar>

  @if (listGroup$ | async; as groups) {
  <div class="content">
    @for (group of groups; track $index) {

    <mat-card
      matRipple
      [matRippleCentered]="true"
      [matRippleTrigger]="trigger"
      [ngStyle]="{ 'border-top': '1rem solid ' + getColor(group) }"
    >
      <a #trigger (click)="openDetails(group)" style="color: black">
        <mat-card-header class="header">
          <mat-card-title>{{ group.name | titlecase }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <div>{{ group.category }}, {{ group.color }}</div>
        </mat-card-content>
      </a>

      <mat-card-footer>
        <app-common-button
          [type]="'favorite'"
          [item]="group"
          [service]="groupService"
        />
        <app-common-button
          [type]="'delete'"
          [item]="group"
          [service]="groupService"
          (itemDeleted)="reloadItens($event)"
        />
      </mat-card-footer>
    </mat-card>

    }
  </div>
  } @else {
  <app-common-error></app-common-error>
  }
</ng-container>
